[package]
name = "desktop-app"
version = "0.1.0"
description = "Velune Desktop Music Player"
authors = ["Velune Team"]
edition = "2021"

[lib]
name = "desktop_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "brotli", "cookies", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
sha1 = "0.10"
md-5 = "0.10"
regex = "1"
rand = "0.8"
url = "2"

[profile.release]
codegen-units = 16
opt-level = 3
strip = false
